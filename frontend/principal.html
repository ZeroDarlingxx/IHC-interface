<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WolfPack - Página Principal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/principal.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/tema.css">
</head>
<body>

<!-- HEADER -->
<header class="wp-header">
  <div class="wp-header-inner container">
    <div class="brand">
      <img src="img/wolfpack.jpg" alt="Logo WolfPack" class="logo" id="menuToggle">
      <span class="site-title">WolfPack</span>
    </div>

    <div class="header-search">
      <input id="searchInput" type="text" placeholder="Pesquisar torneios..." aria-label="Pesquisar torneios">
    </div>

    <button id="btnTema" class="btn-tema" aria-label="Alternar tema">
      <span id="iconTema">🌙</span>
    </button>

    <div class="header-space"></div>
  </div>
</header>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <button class="close-btn" id="sidebarClose" aria-label="Fechar menu">&times;</button>
    <nav class="sidebar-nav">
      <a href="perfil.html">Meu Perfil</a>
      <a href="partidas.html">Partidas</a>
      <a href="customizar.html">Criar Torneio</a>
      <a href="index.html">Sair</a>
    </nav>
  </aside>

  <div id="overlay" class="overlay" hidden></div>

  <!-- MAIN CONTENT -->
  <main class="container main-area">
    <section class="highlight-section">
      <h2>Principais Torneios</h2>
      <div class="tournament-cards">
  <div class="tournament-card" onclick="abrirPartidas(1)">
    <div class="card-title">Torneio 1</div>
  </div>
  <div class="tournament-card" onclick="abrirPartidas(2)">
    <div class="card-title">Torneio 2</div>
  </div>
  <div class="tournament-card" onclick="abrirPartidas(3)">
    <div class="card-title">Torneio 3</div>
  </div>
</div>
    </section>

    <section class="text-center my-4">
     <a href="customizar.html" class="btn btn-primary px-4 py-2">Criar Torneio</a>
    </section>

    <section class="search-section">
      <button id="btnSearch" class="btn btn-secondary">Procurar</button>
    </section>

    <section class="tournament-list" id="tabelaTorneios">

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer text-center">
    <div class="container">
      <p>&copy; 2025 WolfPack. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="js/torneios.js"></script>
  <script src="js/tema.js"></script>

  <script type="module">
  import { tournamentAPI, checkAuth, getCurrentUser } from './js/api.js';
  
  // Verificar autenticação
  checkAuth();
  
  // Carregar torneios
  async function loadTournaments() {
    try {
      const result = await tournamentAPI.getAll();
      
      if (result.success) {
        const torneios = result.data;
        const container = document.getElementById('tabelaTorneios');
        
        // Limpar container
        container.innerHTML = '';
        
        // Criar cards para cada torneio
        torneios.forEach(torneio => {
          const card = document.createElement('div');
          card.className = 'tournament-card';
          card.innerHTML = `
            <div class="card-title">${torneio.nome}</div>
            <div class="card-desc">${torneio.descricao || 'Sem descrição'}</div>
            <div class="card-info">
              <span>🎮 ${torneio.jogo}</span>
              <span>👥 ${torneio.total_equipes || 0} times</span>
              <span>📅 ${new Date(torneio.data_inicio).toLocaleDateString('pt-BR')}</span>
            </div>
            <button class="btn-ver-torneio" onclick="abrirPartidas(${torneio.id_torneio})">
              Ver Partidas
            </button>
          `;
          container.appendChild(card);
        });
      }
    } catch (error) {
      console.error('Erro ao carregar torneios:', error);
    }
  }
  
  // Função para abrir partidas (agora usando ID real)
  window.abrirPartidas = function(torneioId) {
    // Redirecionar para partidas.html passando o ID
    window.location.href = `partidas.html?torneioId=${torneioId}`;
  };
  
  // Carregar torneios quando a página carregar
  document.addEventListener('DOMContentLoaded', loadTournaments);
</script>
</body>
</html>
