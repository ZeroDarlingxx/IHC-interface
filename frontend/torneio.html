<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneio - WolfPack</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/principal.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/torneio.css">
  <link rel="stylesheet" href="css/tema.css"> 
</head>
<body>

  <!-- HEADER UNIFICADO -->
  <header class="wp-header">
    <div class="wp-header-inner container">

      <div class="brand">
        <img src="img/wolfpack.jpg" class="logo" onclick="history.back()" alt="WolfPack Logo">
        <span class="site-title">WolfPack</span>
      </div>

      <div class="header-search">
        <input type="text" placeholder="Pesquisar torneios...">
      </div>

      <!-- BOTÃO DE TEMA CORRETO -->
      <button id="btnTema" class="btn-tema" aria-label="Alternar tema">
        <span id="iconTema">🌙</span>
      </button>

      <div class="header-space"></div>

    </div>
  </header>

  <!-- ÁREA PRINCIPAL -->
  <main class="container main-area py-4">

    <div class="torneio-card">

      <button class="btn btn-voltar" onclick="history.back()">Voltar</button>

      <h2 id="tituloTorneio" class="titulo-exibido"></h2>
      <p id="descricaoTorneio" class="descricao-exibida"></p>

      <button class="btn btn-entrar">Participar</button>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="footer text-center">
    <p>&copy; 2025 WolfPack. Todos os direitos reservados.</p>
  </footer>

  <!-- APENAS O tema.js -->
  <script src="js/tema.js"></script>

  <!-- SCRIPT PARA CARREGAR OS DADOS DO TORNEIO -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const torneios = JSON.parse(localStorage.getItem("torneios") || "[]");
    const torneio = torneios.find(t => t.id == id);

    if (!torneio) {
      document.getElementById("tituloTorneio").innerText = "Torneio não encontrado";
      document.getElementById("descricaoTorneio").innerText = "";
    } else {
      document.getElementById("tituloTorneio").innerText = torneio.titulo;
      document.getElementById("descricaoTorneio").innerText = torneio.descricao;
    }
  </script>

</body>
</html>
