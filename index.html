<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WolfPack - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/tema.css"> <!-- Para consistência visual -->
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-container">
        <img src="img/wolfpack.jpg" alt="Logo WolfPack" class="logo">
        <h1>WolfPack</h1>
      </div>

      <h2>Entrar</h2>
      <form class="login-form" action="principal.html" method="get">
        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-login">Entrar</button>

        <p class="register-text">
          Ainda não tem conta?
          <a href="#" onclick="alert('Funcionalidade de cadastro em desenvolvimento!')">Cadastre-se</a>
        </p>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2025 WolfPack. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Prevenir envio do formulário se estiver vazio (apenas para demonstração)
    document.querySelector('.login-form').addEventListener('submit', function(e) {
      const usuario = document.getElementById('usuario').value;
      const senha = document.getElementById('senha').value;
      
      if (!usuario.trim() || !senha.trim()) {
        e.preventDefault();
        alert('Por favor, preencha todos os campos!');
      }
      // Em um sistema real, aqui viria a validação com o backend
    });
  </script>
</body>
</html>
